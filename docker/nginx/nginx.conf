worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;
  keepalive_timeout 65;

  # Erişim günlüğünde sorgu dizgesi yazılmaz (imzalı medya URL'leri ve OAuth kodları sızmasın)
  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Hız sınırları (uygulama içi sınırlara ek olarak)
  limit_req_zone $binary_remote_addr zone=asf_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=asf_login:10m rate=10r/m;
  limit_req_status 429;

  # Container'lar yeniden oluşturulunca IP'leri değişir. Docker'ın iç DNS'i (127.0.0.11) ile adlar
  # birkaç saniyede bir yeniden çözülür; böylece deploy sonrası eski IP'ye gidip 502 vermez.
  # "server ... resolve" nginx 1.27.3+ gerektirir (imaj: nginx:1.27-alpine).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream asf_web { zone upstream_web 64k; server web:3000 resolve; keepalive 16; }
  upstream asf_api { zone upstream_api 64k; server api:3000 resolve; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/conf.d/asf.conf;
}
