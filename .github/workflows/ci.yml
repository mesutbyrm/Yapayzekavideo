name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asf
          POSTGRES_PASSWORD: asf_dev_pw
          POSTGRES_DB: asf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asf -d asf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Yalnızca CI test veritabanı; gerçek sır değildir
      DATABASE_URL: postgresql://asf:asf_dev_pw@localhost:5432/asf_test
      TEST_DATABASE_URL: postgresql://asf:asf_dev_pw@localhost:5432/asf_test
      TEST_REDIS_URL: redis://localhost:6379/15
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: FFmpeg ve fontlar (video testleri için)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-pil python3-numpy

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Prisma istemcisi
        run: pnpm --filter @asf/core db:generate

      - name: Tip kontrolü
        run: pnpm -r typecheck

      - name: Veritabanı migration
        run: pnpm --filter @asf/core db:deploy

      - name: Core testleri
        run: pnpm --filter @asf/core test

      - name: Web build
        run: pnpm --filter @asf/web build
