# AI Social Factory – üretim kurulumu
# Kullanım:  cp .env.example .env  (değerleri doldurun)  ->  docker compose up -d --build
# Ayrıntılar: docs/INSTALL.md

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-asf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/${POSTGRES_DB:-asf}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}@redis:6379/0
  LOCAL_STORAGE_DIR: /data/storage
  WORK_DIR: /data/work

x-app: &app
  env_file: .env
  restart: unless-stopped
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-asf}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    # BullMQ için: AOF kalıcılık + noeviction (kuyruk anahtarları asla silinmemeli)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Veritabanı migration'ı – her açılışta bir kez çalışır ve çıkar
  migrate:
    <<: *app
    build: { context: ., target: worker, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}", RUNTIME_IMAGE: "${RUNTIME_IMAGE:-ubuntu:24.04}" } }
    image: asf-worker:${APP_VERSION:-latest}
    environment: *app-env
    working_dir: /app/packages/core
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    build: { context: ., target: web, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}", RUNTIME_IMAGE: "${RUNTIME_IMAGE:-ubuntu:24.04}" } }
    image: asf-web:${APP_VERSION:-latest}
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # API: aynı Next.js imajı; Nginx /api/* isteklerini bu servise yönlendirir (bağımsız ölçeklenir)
  api:
    <<: *app
    image: asf-web:${APP_VERSION:-latest}
    environment: *app-env
    volumes:
      - storage:/data/storage
      - ./secrets/google-tts.json:/run/secrets/google-tts.json:ro
    depends_on:
      web: { condition: service_started }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    image: asf-worker:${APP_VERSION:-latest}
    environment: *app-env
    command: ["./node_modules/.bin/tsx", "src/worker.ts"]
    volumes:
    - storage:/data/storage
    - work:/data/work
    - ./secrets/google-tts.json:/run/secrets/google-tts.json:ro
    stop_grace_period: 60s
    # FFmpeg montajı bellek/CPU yoğun: sunucuyu kilitlememesi için sınırlandırılır
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    cpus: ${WORKER_CPUS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: *app
    image: asf-worker:${APP_VERSION:-latest}
    environment: *app-env
    command: ["./node_modules/.bin/tsx", "src/scheduler.ts"]
    mem_limit: 512m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli (ör. panel.ornek.com)}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf:/opt/asf-nginx:ro
      - ./docker/nginx/entrypoint.sh:/asf-entrypoint.sh:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/asf-entrypoint.sh"]
    networks: [internal, public]
    depends_on: [web, api]

  # Let's Encrypt sertifika yenileme (12 saatte bir kontrol). İlk sertifika: scripts/init-ssl.sh
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v3.1.0}
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks: [public]

  # Otomatik yedekleme: günlük pg_dump (+ yerel medya), saklama süresi, opsiyonel R2/S3 kopyası
  backup:
    build: { context: ./docker/backup, args: { PG_IMAGE: "${POSTGRES_IMAGE:-postgres:16-alpine}" } }
    image: asf-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-asf}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-asf}
    volumes:
      - ./backups:/backups
      - storage:/data/storage:ro
    networks: [internal, public]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  internal:
  public:

volumes:
  pgdata:
  redisdata:
  storage:
  work:
  certbot-www:
  letsencrypt:
